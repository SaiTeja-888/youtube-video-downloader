services:
  - type: web
    name: postlink-api
    env: docker
    plan: free
    dockerfilePath: ./docker/backend.Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PROJECT_NAME
        value: POSTLINK media downloader API
      - key: SECRET_KEY
        generateValue: true
      - key: DOWNLOAD_DIR
        value: /tmp/downloads
      - key: BACKEND_CORS_ORIGINS
        value: http://localhost:3000,https://your-frontend-domain.vercel.app
      - key: BACKEND_CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: DATABASE_URL
        fromDatabase:
          name: postlink-db
          property: connectionString
      # --- YouTube / Instagram Bot-bypass configuration ---
      # Option A (Recommended): Paste your Netscape-format cookies from a logged-in
      # YouTube/Instagram session. Export with: yt-dlp --cookies-from-browser chrome --print-to-file cookies.txt ""
      # Then set the contents as a Render Secret File at /etc/secrets/cookies.txt
      # OR paste the raw text in the COOKIES_TEXT env var below.
      # - key: COOKIES_TEXT
      #   value: "<paste Netscape cookie file contents here>"
      #
      # Option B: YouTube PO Token (optional but recommended for server IPs)
      # Generate at: https://github.com/YunzheZJU/youtube-po-token-generator
      # - key: PO_TOKEN
      #   value: "<your-po-token>"
      # - key: VISITOR_DATA
      #   value: "<your-visitor-data>"
      #
      # Option C: Proxy (Optional - routes YouTube requests through a proxy instead of Render's AWS IP)
      # - key: HTTP_PROXY
      #   value: "http://user:password@proxy-host:port"
      #
      # DO NOT set COOKIES_FROM_BROWSER on Render — there is no browser on the server.

databases:
  - name: postlink-db
    plan: free
    databaseName: postlink
    user: postlink
